name: Build MONUMANIA Android Signed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore signing key
        run: |
          echo "${{ secrets.MONUMANIA_KEYSTORE_BASE64 }}" | base64 --decode > MONUMANIA-upload-key.jks

      - name: Create signing properties
        run: |
          echo "storeFile=$(pwd)/MONUMANIA-upload-key.jks" > keystore.properties
          echo "storePassword=${{ secrets.MONUMANIA_KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=monumania" >> keystore.properties
          echo "keyPassword=${{ secrets.MONUMANIA_KEY_PASSWORD }}" >> keystore.properties

      - name: Build signed Android App Bundle
        run: ./gradlew bundleRelease

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: MONUMANIA-SIGNED-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
